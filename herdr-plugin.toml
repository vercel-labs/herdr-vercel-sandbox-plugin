id = "vercel.sandbox"
name = "Vercel Sandbox"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Run one coding-agent CLI per persistent Vercel Sandbox."
platforms = ["linux", "macos"]

[[actions]]
id = "connect-vercel"
title = "Connect Vercel account"
description = "Open the official interactive Vercel CLI login flow in a local Herdr pane. This does not create a Sandbox."
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "link-vercel-project"
title = "Link this worktree to a Vercel project"
description = "Open the official interactive Vercel CLI project-linking flow in a local Herdr pane. This does not create a Sandbox."
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "start-agent"
title = "Start configured agent in a new Sandbox"
description = "Copy the current Git worktree into a new persistent Sandbox and open the configured agent in a Herdr pane."
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "reconnect"
title = "Reconnect agent to this Sandbox"
description = "Start the mapped agent again in the persistent Sandbox associated with the focused pane."
contexts = ["pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "apply-changes"
title = "Apply Sandbox changes locally"
description = "Download a binary Git patch from the focused pane's Sandbox and apply it after git apply --check passes."
contexts = ["pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "stop"
title = "Stop this Sandbox"
description = "Stop the current Sandbox session while preserving its persistent filesystem."
contexts = ["pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "info"
title = "Show Sandbox mapping"
description = "Print the agent kind, installed version, capabilities, and local/remote paths mapped to the focused pane."
contexts = ["pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "replace-sandbox"
title = "Replace this Sandbox"
description = "After a second confirmation invocation, permanently delete the tracked Sandbox and create a fresh replacement for this pane."
contexts = ["pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "forget-mapping"
title = "Delete Sandbox and forget mapping"
description = "After a second confirmation invocation, permanently delete the tracked Sandbox and remove its local pane mapping."
contexts = ["pane"]
command = ["node", "src/action.mjs"]
